# ============================================================================
# CI/CD do front-end Finora (Next.js)
#  CI (todo push e PR): lint, checagem de tipos, testes unitários (Vitest) e build de produção
#  CD (push na main, tag v* ou manual): imagem Docker publicada no GHCR
#       -> ghcr.io/acadl-dev/finora-frontend (usada em back_finora/deploy/k8s/frontend)
# ============================================================================
name: CI/CD frontend

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck
      - name: Testes unitários (Vitest)
        run: npm test
      - name: Build de produção (output standalone)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  image:
    name: Imagem Docker (GHCR)
    needs: ci
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/acadl-dev/finora-frontend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
